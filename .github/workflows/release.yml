name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # needed to create the GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Stub external agent CLIs
        run: |
          mkdir -p "$HOME/.local/bin"
          for cli in claude gh-axi; do
            printf '#!/usr/bin/env bash\nexit 0\n' > "$HOME/.local/bin/$cli"
            chmod +x "$HOME/.local/bin/$cli"
          done
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Test gate
        run: bash test/all.sh

      - name: Verify tag matches CANOPY_VERSION
        run: |
          ver="$(sed -n 's/^CANOPY_VERSION="\(.*\)"/\1/p' lib/common.sh | head -1)"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$ver" != "$tag" ]; then
            echo "tag $GITHUB_REF_NAME does not match CANOPY_VERSION $ver" >&2
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "canopy $GITHUB_REF_NAME" --generate-notes
