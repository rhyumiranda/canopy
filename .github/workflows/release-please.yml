name: release-please

# Automatic releases from conventional commits. On each push to main, this keeps
# a "release PR" open that bumps CANOPY_VERSION (via the x-release-please-version
# marker in lib/common.sh) and writes CHANGELOG.md. Merge that PR to tag + publish
# the GitHub Release — no manual version bump, tag, or push.

on:
  push:
    branches: [main]

permissions:
  contents: write        # create the release + tag
  pull-requests: write   # open/update the release PR

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
